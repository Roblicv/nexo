# Reglas de Nexo. Se escriben ANTES de mirar los resultados.
# Ninguna variable se ajusta a mano: cada valor sale de una fuente pública con la regla escrita aquí.
# Cambiar una regla exige subir "version" y queda registrado en el historial de Git.

version: 3
registrado: "2026-11-04"
cambios:
  - "v1 (2026-10-29): primera versión."
  - "v2 (2026-11-03): se elimina la simulación; se añaden conflicto armado, conflicto EE. UU.-Irán y cooperación entre países; hipótesis de la tregua; ejecución cada 2 días."
  - "v3 (2026-11-04): Francia y Brasil se sustituyen por regiones (Latinoamérica, Europa occidental, Europa del Este); el juego del pilar 1 toma sus entradas de los datos."

transformacion: "x = tanh(z / 2), con z = (lectura - media de la línea base) / desviación de la línea base"
vigencia_dias: 28  # una lectura más vieja que esto se muestra, pero no entra al pronóstico

pronostico:
  tasa_base:
    cualquiera: {eventos: 5, anios: 126, nota: "Pandemias de 1918, 1957, 1968, 2009 y 2020"}
    severa: {eventos: 2, anios: 126, nota: "Pandemias de 1918 y 2020"}
  tendencia_anual: 0.015
  justificacion_tendencia: "Un tercio del ~5 % anual de aumento de derrames zoonóticos de alto impacto (Meadows y colegas, BMJ Global Health, 2023)."
  simulaciones: 1500
  semilla: 20261029

validacion:
  resultado: "Año con al menos una nueva emergencia de salud pública de importancia internacional declarada por la OMS"
  archivo: datos/emergencias_oms.yaml
  regla: "Un motor entra al pronóstico solo si mejora la puntuación de Brier fuera de muestra frente a la tasa base."
  minimo_anios: 10
  anios_calentamiento: 5

variables:
  brotes_oms:
    motor: brotes
    fuente: oms_don
    etiqueta: "Brotes notificados por la OMS"
    lectura: "Notas de Disease Outbreak News publicadas en las últimas 12 semanas"
    linea_base: "La misma ventana de 12 semanas en cada año de 2015 a 2025"
  resp_europa:
    motor: brotes
    fuente: ecdc_erviss
    etiqueta: "Gripe en Europa (ECDC)"
    lectura: "Positividad de gripe en atención primaria centinela, UE/EEE, última semana publicada"
    linea_base: "Misma semana epidemiológica (±2) en temporadas anteriores"
  ili_eeuu:
    motor: brotes
    fuente: delphi_fluview
    etiqueta: "Síndrome gripal en EE. UU. (CDC)"
    lectura: "Porcentaje ponderado de consultas por síndrome gripal (wILI) del CDC, vía Delphi"
    linea_base: "Misma semana epidemiológica (±2) en las 5 temporadas anteriores"
  movilizacion_global:
    motor: prot
    fuente: gdelt
    etiqueta: "Movilización social mundial (GDELT)"
    consulta: "theme:PROTEST"
    lectura: "Intensidad de cobertura de noticias sobre protestas, últimas 4 semanas"
    linea_base: "Las 8 semanas anteriores dentro de la ventana de GDELT"
  movilizacion_latam:
    motor: null
    fuente: gdelt
    etiqueta: "Movilización en Latinoamérica"
    consulta: "theme:PROTEST (sourcecountry:argentina OR sourcecountry:bolivia OR sourcecountry:brazil OR sourcecountry:chile OR sourcecountry:colombia OR sourcecountry:ecuador OR sourcecountry:mexico OR sourcecountry:peru OR sourcecountry:venezuela)"
    lectura: "Cobertura de protestas en medios de nueve países latinoamericanos, últimas 4 semanas"
    linea_base: "Las 8 semanas anteriores"
  movilizacion_europa_oeste:
    motor: null
    fuente: gdelt
    etiqueta: "Movilización en Europa occidental"
    consulta: "theme:PROTEST (sourcecountry:france OR sourcecountry:germany OR sourcecountry:spain OR sourcecountry:italy OR sourcecountry:unitedkingdom OR sourcecountry:portugal OR sourcecountry:belgium OR sourcecountry:netherlands)"
    lectura: "Cobertura de protestas en medios de ocho países de Europa occidental, últimas 4 semanas"
    linea_base: "Las 8 semanas anteriores"
  movilizacion_europa_este:
    motor: null
    fuente: gdelt
    etiqueta: "Movilización en Europa del Este"
    consulta: "theme:PROTEST (sourcecountry:poland OR sourcecountry:ukraine OR sourcecountry:hungary OR sourcecountry:romania OR sourcecountry:serbia OR sourcecountry:georgia OR sourcecountry:slovakia OR sourcecountry:bulgaria)"
    lectura: "Cobertura de protestas en medios de ocho países de Europa del Este, últimas 4 semanas"
    linea_base: "Las 8 semanas anteriores"
  conflicto_global:
    motor: conflicto
    fuente: gdelt
    etiqueta: "Conflicto armado mundial (GDELT)"
    consulta: "theme:ARMEDCONFLICT"
    lectura: "Intensidad de cobertura de noticias sobre conflicto armado, últimas 4 semanas"
    linea_base: "Las 8 semanas anteriores dentro de la ventana de GDELT"
  eeuu_iran:
    motor: null
    fuente: gdelt
    etiqueta: "Conflicto EE. UU.-Irán (contexto)"
    consulta: 'iran "united states" theme:ARMEDCONFLICT'
    lectura: "Cobertura de conflicto armado que menciona a Irán y a EE. UU., últimas 4 semanas"
    linea_base: "Las 8 semanas anteriores"
  cooperacion_global:
    motor: cooperacion
    fuente: gdelt
    etiqueta: "Cooperación y diplomacia entre países (GDELT)"
    consulta: "(theme:NEGOTIATIONS OR theme:WB_2473_DIPLOMACY_AND_NEGOTIATIONS OR theme:WB_2471_PEACEKEEPING)"
    lectura: "Intensidad de cobertura de negociaciones, diplomacia y mantenimiento de la paz, últimas 4 semanas"
    linea_base: "Las 8 semanas anteriores dentro de la ventana de GDELT"
  conflicto_acled:
    motor: conflicto
    fuente: acled
    opcional: true
    etiqueta: "Eventos de combate y bombardeo (ACLED)"
    tipos_evento: ["Battles", "Explosions/Remote violence"]
    paises: [Iran, Israel, Ukraine, Russia, Sudan, "Democratic Republic of Congo", Myanmar, Yemen]
    lectura: "Combates, bombardeos y explosiones en los países vigilados, últimas 4 semanas"
    linea_base: "Las mismas 4 semanas del calendario en 2018-2025"
  protestas_acled:
    motor: prot
    fuente: acled
    opcional: true
    etiqueta: "Eventos de protesta (ACLED)"
    paises: [France, Brazil, Chile, Colombia, United States]
    lectura: "Eventos de protesta en los países vigilados, últimas 4 semanas"
    linea_base: "Las mismas 4 semanas del calendario en 2018-2025"

motores:
  brotes: {e_previa: 0.20, combinacion: "media de las variables disponibles"}
  prot:   {e_previa: 0.05, combinacion: "ACLED si está disponible; si no, GDELT mundial"}
  conflicto: {e_previa: 0.15, combinacion: "ACLED si está disponible; si no, GDELT mundial", razon: "La guerra debilita la vigilancia y los sistemas de salud"}
  cooperacion: {e_previa: -0.10, combinacion: "media de las variables disponibles", razon: "Más cooperación abarata anunciar un brote (pilar 1)"}
  ganado: {e_previa: 0.25, pendiente: "WOAH-WAHIS no tiene API pública"}
  suelo:  {e_previa: 0.20, pendiente: "Global Forest Watch publica una vez al año"}
  fauna:  {e_previa: 0.15, pendiente: "Sin serie abierta y continua"}
  clima:  {e_previa: 0.10, pendiente: "Copernicus requiere procesar datos en rejilla"}
  aereo:  {e_previa: 0.15, pendiente: "Los datos de la OACI son de pago"}
  urbano: {e_previa: 0.10, pendiente: "ONU-Hábitat publica una vez al año"}
  conf:   {e_previa: -0.15, pendiente: "Encuestas de confianza anuales"}

juego:
  descripcion: "Dilema de reportar un brote: el equilibrio se recalcula con los datos de cada ejecución."
  base: {c: 3, pi: 0.5, b: 5, a: 2, g: 5, s: 0.5}
  # Cada parámetro se multiplica por e^(k·x), donde x es el valor del motor (−1 a +1) en esta ejecución.
  entradas:
    pi: {motor: conflicto, k: 0.6, efecto: "Más conflicto, más probabilidad de sanciones y cierres de fronteras"}
    pi_coop: {parametro: pi, motor: cooperacion, k: -0.6, efecto: "Más cooperación, menos sanciones"}
    a: {motor: cooperacion, k: 0.5, efecto: "Más cooperación, más apoyo al país que anuncia"}
    g: {motor: cooperacion, k: 0.3, efecto: "Más cooperación, más costo reputacional por ocultar"}
    c: {motor: prot, k: 0.3, efecto: "Más movilización, más costo político interno de anunciar"}
  limites: {pi: [0.02, 0.98]}
  regla: "El equilibrio de hoy se muestra siempre; su efecto entra al pronóstico solo cuando el motor del juego se valide."

hipotesis:
  autor:
    nombre: "Hipótesis del autor: las élites desactivan la movilización social a través de enfermedades"
    regla: "Su peso es el que resulte de la validación con protestas y emergencias; 0 mientras no haya historial suficiente."
  tregua:
    nombre: "Hipótesis de la tregua: una emergencia sanitaria reduce el conflicto armado"
    regla: "Se apoya si, en la mayoría de las emergencias declaradas desde 2018, los combates y bombardeos de las 12 semanas siguientes son al menos un 10 % menores que en las 12 anteriores. Necesita ACLED."
    umbral: 0.9
    ventana_semanas: 12

poder_economico:
  pendiente: "Concentración de riqueza durante emergencias: World Inequality Database y listas de multimillonarios."

eventos:
  regla_simetria: "Los bloques políticos se clasifican con una fuente externa (ParlGov o V-Party), nunca a mano, y la misma regla se aplica gane quien gane."
  regla_participantes: "Media geométrica entre la cifra oficial y la de los organizadores, con ambas como rango."
